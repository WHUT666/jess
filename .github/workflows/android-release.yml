name: Android CI and signed release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Prepare debug signing (CI only)
        run: |
          chmod +x gradlew
          touch .env
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Publish debug build as a workflow artifact (not a stable release)
        uses: actions/upload-artifact@v4
        with:
          name: ArenaPilot-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      EXPECTED_SIGNER_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      KEYSTORE_PATH: ${{ runner.temp }}/arenapilot-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Check version and existing signer continuity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq "versionName = \"${VERSION}\"" app/build.gradle.kts || { echo 'Tag/versionName mismatch'; exit 1; }
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo 'BLOCKED: configure the original signing keystore and passwords as GitHub Actions secrets.'
            exit 1
          fi
          if [[ ! "$EXPECTED_SIGNER_SHA256" =~ ^([[:xdigit:]]{2}:?){32}$ ]]; then
            echo 'BLOCKED: set RELEASE_CERT_SHA256 to the v1.0.0 APK signer fingerprint.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          chmod +x gradlew
          touch .env
      - name: Build release binaries using the original signing key
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Verify release APK signer and stage versioned files
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          actual=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          expected=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$actual" == "$expected" ]] || { echo 'BLOCKED: APK signer does not match v1.0.0'; exit 1; }
          jarsigner -verify "$AAB" >/dev/null
          mkdir -p release-output
          cp "$APK" "release-output/ArenaPilot-${GITHUB_REF_NAME}-release.apk"
          cp "$AAB" "release-output/ArenaPilot-${GITHUB_REF_NAME}-release.aab"
          (cd release-output && sha256sum *) > release-output/SHA256SUMS.txt
      - name: Publish GitHub release only after tests and signer verification
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ArenaPilot ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v1.0.1.md
          files: release-output/*
          fail_on_unmatched_files: true
