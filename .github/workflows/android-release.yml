name: Android CI/CD - Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      release_title:
        description: "Release Title"
        required: false
        default: "ArenaPilot v1.0.0 - 实时对战监控与自动引导引擎"
      release_notes:
        description: "Release Notes"
        required: false
        default: |
          🚀 ArenaPilot 第一个正式版本发布 (v1.0.0)

          ✨ 核心特性:
          - 🎯 100% 真实直连 lmarena.ai (LMSYS Chatbot Arena) 盲测对战与全模型战场
          - 👁️ DOM 实时渲染变动监控，精准感知模型流式输出完毕状态与静默停顿
          - ⚡ 智能预设词库与多模式引导 (顺序轮询 / 随机探索 / 深度追问 / 单次遍历)
          - 🔍 模型指纹探测器：自动诱导模型输出自识架构，结合官方解密全流程揭晓
          - 🔐 真实 Cookie 与登录凭证管理，支持跨站凭证保持与账号切换
          - 📱 前台悬浮监控 + 系统级无障碍辅助服务 (Accessibility Service) 双模并发
          - 💾 Room 架构会话沉淀库，完整留存多轮对决记录、模型判词与胜利者投票
          - 🛡️ 安全熔断与停止词保护机制，防止死循环与额度耗尽

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK, AAB & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Signing Keystores & Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          chmod +x ./gradlew

          # Restore or generate debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Restore or generate release keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${STORE_PWD:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PWD:-android}" >> $GITHUB_ENV
          elif [ ! -f my-upload-key.jks ]; then
            echo "No custom keystore provided in secrets, generating standard release keystore..."
            keytool -genkey -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=ArenaPilot, OU=AI, O=ArenaPilot, L=San Francisco, S=CA, C=US"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "STORE_PASSWORD=${STORE_PWD:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PWD:-android}" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Build Android App Bundle (AAB)
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Package & Stage Release Artifacts
        id: stage_artifacts
        run: |
          mkdir -p release-output
          
          # Copy APKs
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-output/ArenaPilot-v1.0.0-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-output/ArenaPilot-v1.0.0-debug.apk
          fi

          # Copy AAB
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release-output/ArenaPilot-v1.0.0-release.aab
          fi

          echo "Artifacts staged:"
          ls -la release-output/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ArenaPilot-v1.0.0-Binaries
          path: release-output/
          if-no-files-found: error

      - name: Determine Release Tag & Info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_title }}"
            NOTES="${{ github.event.inputs.release_notes }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="ArenaPilot $TAG"
            NOTES="Release $TAG for ArenaPilot"
          else
            TAG=""
            TITLE=""
            NOTES=""
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Publish GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: release-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
